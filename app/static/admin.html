<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Professional Home Inspection</title><link rel="stylesheet" href="/assets/site.css"></head>
<body><header class="top"><div class="wrap nav"><div class="brand">PROFESSIONAL <span>HOME INSPECTION</span></div><a href="/">Public website</a></div></header>
<main><section><div class="wrap"><div class="eyebrow">Private area</div><h1>Enquiry dashboard</h1>
<div class="panel"><div class="notice">Administrator access is protected by a short-lived, HttpOnly session. Sign out when finished, especially on a shared device.</div>
<div id="login"><div class="field"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" maxlength="256"></div><div class="actions"><button id="sign-in" class="btn">Sign in</button></div></div>
<div id="dashboard" hidden><div class="field"><label for="view">View</label><select id="view"><option value="active">Active enquiries</option><option value="deleted">Deleted enquiries</option><option value="all">All enquiries</option></select></div>
<div class="actions"><button id="load" class="btn">Load enquiries</button><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn secondary">Next</button><button id="sign-out" class="btn secondary">Sign out</button></div></div>
<div id="msg" class="status" role="status" aria-live="polite"></div><div id="rows"></div></div></div></section></main>
<script>
let page=1, authenticated=false;
const msg=document.querySelector('#msg'), rows=document.querySelector('#rows');
function showAuth(value){authenticated=value;document.querySelector('#login').hidden=value;document.querySelector('#dashboard').hidden=!value;}
async function signIn(){msg.textContent='Signing in…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok){msg.textContent=d.detail||'Sign-in failed';return;}document.querySelector('#password').value='';showAuth(true);msg.textContent='Signed in. Session expires after eight hours.';load();}catch{msg.textContent='Could not connect to the server.'}}
async function signOut(){try{await fetch('/api/admin/logout',{method:'POST'});}finally{showAuth(false);rows.replaceChildren();msg.textContent='Signed out.';}}
async function load(){if(!authenticated)return;msg.textContent='Loading…';rows.replaceChildren();try{const view=document.querySelector('#view').value;const r=await fetch('/api/admin/enquiries?page='+page+'&status='+view);const d=await r.json();if(r.status===401){showAuth(false);msg.textContent='Your session expired. Please sign in again.';return;}if(!r.ok){msg.textContent=d.detail||'Could not load enquiries';return;}msg.textContent='Page '+d.page+' of '+Math.max(d.pages,1)+' · '+d.total+' enquiries';if(!d.items.length){rows.textContent='No enquiries in this view.';return;}for(const x of d.items){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=x.name+' — '+x.status;const p=document.createElement('p');p.textContent=x.email+' · '+x.property_address+' · '+x.approximate_size_sqft+' sq ft';const detail=document.createElement('p');detail.textContent='Preferred dates: '+x.preferred_dates+' | '+x.message;card.append(h,p,detail);rows.append(card);}}catch{msg.textContent='Could not connect to the server.'}}
document.querySelector('#sign-in').addEventListener('click',signIn);document.querySelector('#password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});document.querySelector('#sign-out').addEventListener('click',signOut);document.querySelector('#load').addEventListener('click',()=>{page=1;load();});document.querySelector('#prev').addEventListener('click',()=>{page=Math.max(1,page-1);load();});document.querySelector('#next').addEventListener('click',()=>{page++;load();});
</script></body></html>
