<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Professional Home Inspection</title><link rel="stylesheet" href="/assets/site.css"></head><body><header class="top"><div class="wrap nav"><div class="brand">PROFESSIONAL <span>HOME INSPECTION</span></div><a href="/">Public website</a></div></header><main><section><div class="wrap"><div class="eyebrow">Private area</div><h1>Enquiry dashboard</h1><div class="panel"><div class="notice">Admin access requires the ADMIN_API_KEY configured by the site owner in the hosting environment. Do not share this key or use this dashboard on a public computer.</div><div class="field"><label for="key">Administrator API key</label><input id="key" type="password" autocomplete="current-password"></div><button id="load" class="btn">Load enquiries</button><div id="msg" class="status"></div><div id="rows"></div></div></div></section></main><script>
document.querySelector('#load').addEventListener('click',async()=>{const key=document.querySelector('#key').value,msg=document.querySelector('#msg'),rows=document.querySelector('#rows');msg.textContent='Loading…';rows.innerHTML='';try{const r=await fetch('/api/admin/enquiries',{headers:{Authorization:'Bearer '+key}}),d=await r.json();if(!r.ok){msg.textContent=d.detail||'Access denied';return}msg.textContent=d.length+' enquiries';if(!d.length){rows.textContent='No enquiries yet.';return}for(const x of d){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=x.name+' — '+x.status;const p=document.createElement('p');p.textContent=x.email+' · '+x.property_address+' · '+x.approximate_size_sqft+' sq ft';const detail=document.createElement('p');detail.textContent='Preferred dates: '+x.preferred_dates+' | '+x.message;card.append(h,p,detail);rows.append(card)}}catch{msg.textContent='Could not connect to the server.'}});
</script></body></html>
