<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Professional Home Inspection</title><link rel="stylesheet" href="/assets/site.css"></head>
<body><header class="top"><div class="wrap nav"><div class="brand">PROFESSIONAL <span>HOME INSPECTION</span></div><a href="/">Public website</a></div></header>
<main><section><div class="wrap"><div class="eyebrow">Private area</div><h1>Enquiry dashboard</h1>
<div class="panel"><div class="notice">Administrator access is protected by a short-lived, HttpOnly session. Sign out when finished, especially on a shared device.</div>
<div id="login"><div class="field"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" maxlength="256"></div><div class="actions"><button id="sign-in" class="btn">Sign in</button></div></div>
<div id="dashboard" hidden>
<div class="field"><label for="view">Enquiry view</label><select id="view"><option value="active">Active enquiries</option><option value="deleted">Deleted enquiries</option><option value="all">All enquiries</option></select></div>
<div class="actions"><button id="load" class="btn">Load enquiries</button><button id="bookings" class="btn secondary">Load booking proposals</button><button id="prev" class="btn secondary">Previous</button><button id="next" class="btn secondary">Next</button><button id="sign-out" class="btn secondary">Sign out</button></div>
</div>
<div id="msg" class="status" role="status" aria-live="polite"></div><div id="rows"></div></div></div></section></main>
<script>
let page=1, authenticated=false;
const msg=document.querySelector('#msg'), rows=document.querySelector('#rows');
const statuses=['new','reviewing','awaiting_customer','approved','declined','deleted'];
function showAuth(value){authenticated=value;document.querySelector('#login').hidden=value;document.querySelector('#dashboard').hidden=!value;}
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node;}
async function api(path,options={}){const response=await fetch(path,options);const data=await response.json().catch(()=>({}));if(response.status===401){showAuth(false);throw new Error('Your session expired. Please sign in again.');}if(!response.ok)throw new Error(data.detail||'Request failed');return data;}
async function signIn(){msg.textContent='Signing in…';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});document.querySelector('#password').value='';showAuth(true);msg.textContent='Signed in. Session expires after eight hours.';load();}catch(error){msg.textContent=error.message;}}
async function signOut(){try{await fetch('/api/admin/logout',{method:'POST'});}finally{showAuth(false);rows.replaceChildren();msg.textContent='Signed out.';}}
function statusEditor(item){const wrap=element('div',undefined,'actions');const select=element('select');for(const value of statuses){const option=element('option',value);option.value=value;option.selected=value===item.status;select.append(option);}const save=element('button','Save status','btn secondary');save.type='button';save.addEventListener('click',async()=>{save.disabled=true;try{await api('/api/admin/enquiries/'+item.id+'/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:select.value})});msg.textContent='Enquiry #'+item.id+' status updated.';load();}catch(error){msg.textContent=error.message;}finally{save.disabled=false;}});wrap.append(select,save);return wrap;}
function proposalEditor(item){const box=element('div',undefined,'panel');box.append(element('h3','Propose up to three appointment options'));const inputs=[];for(let i=1;i<=3;i++){const field=element('div', '');field.className='field';const label=element('label','Option '+i+' (local Vancouver time)');const input=element('input');input.type='datetime-local';input.setAttribute('aria-label','Appointment option '+i);if(i===1)input.required=true;field.append(label,input);box.append(field);inputs.push(input);}const save=element('button','Save proposal (not sent)','btn');save.type='button';save.addEventListener('click',async()=>{const values=inputs.map(x=>x.value?x.value.replace('T',' '):'');if(!values[0]){msg.textContent='Please enter at least the first appointment option.';return;}save.disabled=true;try{await api('/api/admin/enquiries/'+item.id+'/proposals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({option_1:values[0],option_2:values[1],option_3:values[2]})});msg.textContent='Proposal saved for enquiry #'+item.id+'. No customer message was sent.';load();}catch(error){msg.textContent=error.message;}finally{save.disabled=false;}});box.append(save);return box;}
async function load(){if(!authenticated)return;msg.textContent='Loading enquiries…';rows.replaceChildren();try{const view=document.querySelector('#view').value;const d=await api('/api/admin/enquiries?page='+page+'&status='+view);msg.textContent='Page '+d.page+' of '+Math.max(d.pages,1)+' · '+d.total+' enquiries';if(!d.items.length){rows.textContent='No enquiries in this view.';return;}for(const item of d.items){const card=element('article',undefined,'card');card.append(element('h3',item.name+' — '+item.status));card.append(element('p',item.email+' · '+item.phone+' · '+item.property_address));card.append(element('p',item.property_type+' · '+item.approximate_size_sqft+' sq ft'));card.append(element('p','Preferred dates: '+item.preferred_dates));card.append(element('p',item.message));card.append(statusEditor(item));if(item.status!=='deleted')card.append(proposalEditor(item));rows.append(card);}}catch(error){msg.textContent=error.message;}}
async function loadBookings(){if(!authenticated)return;msg.textContent='Loading booking proposals…';rows.replaceChildren();try{const bookings=await api('/api/admin/bookings');msg.textContent=bookings.length+' booking proposals';if(!bookings.length){rows.textContent='No proposals yet.';return;}for(const item of bookings){const card=element('article',undefined,'card');card.append(element('h3','Proposal #'+item.id+' · Enquiry #'+item.enquiry_id));card.append(element('p','Status: '+item.status));for(const option of item.options)card.append(element('p',option));rows.append(card);}}catch(error){msg.textContent=error.message;}}
document.querySelector('#sign-in').addEventListener('click',signIn);document.querySelector('#password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn();});document.querySelector('#sign-out').addEventListener('click',signOut);document.querySelector('#load').addEventListener('click',()=>{page=1;load();});document.querySelector('#bookings').addEventListener('click',loadBookings);document.querySelector('#view').addEventListener('change',()=>{page=1;load();});document.querySelector('#prev').addEventListener('click',()=>{page=Math.max(1,page-1);load();});document.querySelector('#next').addEventListener('click',()=>{page++;load();});
</script></body></html>
